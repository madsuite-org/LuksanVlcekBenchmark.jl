[sources]
# The recipe API (`nargs`, deferred argument nodes) is on ExaModels main and in
# no tagged release yet; without this pin CI resolves the registry's v0.11.x and
# every ExaModels-backend test fails on the `nargs` keyword.  The package's
# Project.toml deliberately carries NO [extras]/[targets]: with those present
# Pkg builds the legacy target environment and never reads this file, which is
# how the pin was silently ignored for a day.  REPOINT to a release when one
# carries the API.
ExaModels = {rev = "main", url = "https://github.com/madsuite-org/ExaModels.jl"}
