name = "LuksanVlcekBenchmark"
uuid = "dc0393f0-98a3-4386-a65b-465e1307889b"
version = "1.0.0"
authors = ["jerryfung", "sshin23", "and contributors"]

[weakdeps]
ExaModels = "1037b233-b668-4ce9-9b63-f9f681f55dd2"
ExaModelsCompiler = "3d1e9a26-5b74-4f0c-9a2b-7c8f4e11d3a7"
JuMP = "4076af6c-e467-56ae-b986-b466b2749572"

[extensions]
LuksanVlcekBenchmarkExaModels = ["ExaModels"]
LuksanVlcekBenchmarkExaModelsCompiler = ["ExaModelsCompiler"]
LuksanVlcekBenchmarkJuMP = ["JuMP"]

[compat]
# ExaModels and ExaModelsCompiler are deliberately absent: the recipe API this
# package is built on is on ExaModels main and in no registered version (the
# registry's newest is v0.11.2, which has no `nargs`), and ExaModelsCompiler is
# not registered at all.  A bound written now would name versions that do not
# exist.  Add both when they are released; until then this package is not
# registrable, and test/Project.toml carries the git pin CI resolves.
JuMP = "^1.19"
julia = "1.11"
